# Konfigurasi Nginx untuk MTQ Kota Malang 2026.
# Placeholder __SERVER_NAME__, __APP_DIR__, __PHP_SOCK__ diisi oleh deploy/setup-server.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    root __APP_DIR__/public;

    index index.php;
    charset utf-8;

    # Bukti transfer maksimal 5 MB (validasi aplikasi); beri ruang untuk overhead form.
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset hasil build Vite memakai nama ber-hash, aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Tolak akses ke file tersembunyi (.env, .git, dll.) dan file PHP lain.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
